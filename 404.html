<!DOCTYPE html>
<html lang="lv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1e2521" />
    <meta name="robots" content="noindex" />
    <title>Lapa nav atrasta — Jūrasmala</title>
    <!-- Served by GitHub Pages for any missing path, so all URLs are absolute -->
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="/favicon.ico" />
    <style>
      .not-found { position: relative; min-height: 100vh; min-height: 100svh; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; padding: 22px var(--m) var(--sp-4); }
      .not-found::before { content: ""; position: absolute; inset: 0; background: url("/data/coastal_image.webp") center / cover; filter: brightness(0.62) saturate(0.85); }
      .not-found::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(30,37,33,0.55), rgba(30,37,33,0) 30%, rgba(30,37,33,0) 45%, rgba(30,37,33,0.88)); }
      .not-found > * { position: relative; z-index: 1; }
      .not-found .logo img { height: 40px; width: auto; }
      .not-found h1 { font-weight: 300; font-size: var(--fs-h2); line-height: 1; letter-spacing: -0.02em; padding-bottom: 0.12em; }
      .not-found .why { font-style: italic; font-weight: 400; font-size: var(--fs-sub); color: var(--bone-dim); margin-top: var(--sp-1); max-width: 30em; }
      .not-found .home { display: inline-block; margin-top: var(--sp-3); font-size: var(--fs-lead); line-height: 1.3; }
      .not-found .alt { margin-top: var(--sp-2); }
      .not-found .alt a { border-bottom: 1px solid currentColor; }
    </style>
    <link rel="stylesheet" href="/styles-mobile.css" media="(max-width: 860px)" />
  </head>
  <body>
    <main class="not-found">
      <a class="logo" href="/"><img src="/data/logo.png" alt="Jūrasmala" width="413" height="138" /></a>
      <div>
        <h1>Lapa nav atrasta</h1>
        <p class="why">Šī adrese neeksistē vai lapa ir pārvietota.</p>
        <a class="home link" href="/">Uz sākumlapu</a>
        <p class="alt sans dim" lang="en">Page not found. <a href="/">Go to the home page</a></p>
      </div>
    </main>
  </body>
</html>
